<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/detail.css">
</head>
<body>

    <div id="falling-container"></div>

    <div class="top-bar">
        <a href="index.html" class="logo-link" id="back-home">
            <img src="images/ui/logo.png" alt="霹靂卡霹靂拉拉，波波力那貝貝魯多" class="logo-img">
        </a>
        <div class="cart-box" id="cart-icon">
            <img src="images/ui/icon_tcart.png" alt="購物車" class="cart-icon-img">
            <span class="cart-badge" id="cart-count">0</span>
        </div>
    </div>

    <div class="scrapbook-wrapper" id="detail-container">
        
        <div class="detail-loading" id="loading-text">隱藏著黑暗力量的鑰匙啊！在我面前顯示你真正的力量</div>

        <div class="detail-main-container" id="main-content-layout" style="display: none;">
            
            <div class="left-panel" id="left-panel"></div>

            <div class="right-panel" id="right-panel">
                <div class="memo-container">
                    
                    <div class="product-header">
                        <span class="brand-tag" id="product-brand">璦坊嚴選</span>
                        <h1 class="product-title" id="product-name">溫柔童裝單品</h1>
                    </div>

                    <div class="product-story-zone">
                        <p class="product-note" id="product-note">這件衣裳帶著微風的祝福，精選最柔軟的面料，親膚透氣，讓寶貝自在翻滾</p>
                    </div>

                    <div class="spec-section">
                        <div class="spec-label">顏色</div>
                        <div class="option-pill-group" id="color-options"></div>
                    </div>

                    <div class="spec-section">
                        <div class="spec-label">尺寸</div>
                        <div class="option-pill-group" id="size-options"></div>
                        </div>

                    <div class="bottom-collage-zone">
                        
                        <div class="size-guide-trigger" id="size-guide-btn">
                            <img src="images/ui/detail_sizeguide_btn.png" alt="查看尺寸">
                        </div>

                        <div class="buy-action-zone" id="buy-zone">
                            <img src="images/ui/detail_buynow.png" alt="放入購物車" class="buy-now-icon" id="buy-now-btn">
                        </div>

                        <div class="price-sticker-tag" id="price-zone">
                            <span class="price-currency">NT$</span>
                            <span class="price-number" id="product-price">0</span>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </div>

    <div class="size-popup-overlay" id="size-popup-overlay">
        <div class="size-popup-content">
            <button class="close-popup-btn" id="close-size-popup">×</button>
            <div class="popup-image-container">
                <img src="" alt="尺寸說明圖" id="popup-size-img">
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>    
    <script src="js/detail.js"></script>
</body>
</html>
