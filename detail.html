<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/detail.css">
</head>
<body>

    <!-- 頂部高雅品牌列 -->
    <header class="menu-header">
        <h1 class="brand-logo">Aifang kids</h1>
        <div class="order-uid-badge">專屬單號: <span id="display-afid">連線中...</span></div>
    </header>

    <!-- 韓系橫向滾動分類導航 -->
    <nav class="category-nav">
        <button class="cat-btn active" data-cat="ALL">全部商品</button>
        <button class="cat-btn" data-cat="TOP">TOP</button>
        <button class="cat-btn" data-cat="BOTTOM">BOTTOM</button>
        <button class="cat-btn" data-cat="SET">SET</button>
        <button class="cat-btn" data-cat="BEBE">BEBE</button>
        <button class="cat-btn" data-cat="ACC">ACC</button>
    </nav>

    <!-- 主要商品展示網格區 -->
    <main class="menu-container">
        <!-- 讀取狀態圈圈 -->
        <div id="catalog-loading" class="loading-status">
            <div class="spinner"></div>
            <p>🐾 正在讀取商品資料...</p>
        </div>
        
        <!-- 商品卡片動態注入地基 -->
        <div id="products-grid" class="products-grid"></div>
    </main>

    <!-- 底部固定購物車捷徑列 -->
    <div class="sticky-footer">
        <div class="footer-hint">選擇商品資料即可加入暫存追加區</div>
        <button class="btn-cart-main" id="btn-go-cart">🛒 前往我的暫存車</button>
    </div>

    <!-- 確保 DOM 載入完畢才執行大腦 -->
    <script src="js/detail.js"></script>
    <script src="js/articles.js"></script>

</body>
</html>
