<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/detail.css">
</head>
<body>

    <div id="falling-container"></div>

    <div class="detail-wrapper">
        <header class="client-header">
            <div class="header-info">
                <span class="welcome-tag">Welcome to AIFANG KIDS</span>
                <div class="user-uid-badge">訂單編號：<span id="txt-user-uid">載入中</span></div>
            </div>
        </header>

        <main class="products-main">
            <div id="catalog-loading" class="catalog-status">
                <div class="sub-spinner"></div>
                <p>🐾 正在從韓國搬運漂亮衣服中</p>
            </div>

            <div id="catalog-empty" class="catalog-status hidden">
                <p>衣服正在打包準備上架中，敬請期待</p>
            </div>

            <div id="product-grid" class="product-grid hidden"></div>
        </main>
    </div>

    <div id="sticky-cart-bar" class="sticky-cart-bar hidden">
        <div class="cart-bar-container">
            <div class="cart-summary">
                <span class="summary-label">已選商品</span>
                <span id="total-qty-badge" class="summary-count">0</span>
                <span class="summary-unit">件</span>
            </div>
            <button id="btn-go-cart" class="btn-common btn-next-step">
                🛒 前往購物車結帳 ➔
            </button>
        </div>
    </div>

    <script src="js/detail.js"></script>
    <script src="js/articles.js"></script>
</body>
</html>
