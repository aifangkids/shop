<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/detail.css">
</head>
<body>

    <!-- 手機響應式專用：滾動隱藏後浮現在左上角的 ︙ 控制按鈕 -->
    <button id="mobile-menu-trigger" class="mobile-menu-btn">︙</button>

    <!-- 頂部高雅品牌列 -->
    <header class="menu-header">
        <h1 class="brand-logo">Aifang kids</h1>
        <div class="order-uid-badge">專屬訂單編號: <span id="display-afid">連線中...</span></div>
    </header>

    <!-- 雙層聯動分類導航包裹盒 -->
    <div id="navigation-wrapper" class="navigation-wrapper">
        <!-- 第一層：品牌切換列 -->
        <div class="brand-nav-container">
            <div id="brand-nav-list" class="scroll-nav-row">
                <span class="nav-loading-text">品牌讀取中...</span>
            </div>
        </div>
        
        <!-- 第二層：該品牌旗下對應擁有的 Category 大分類列（預設隱藏） -->
        <div id="category-nav-container" class="category-nav-container hidden">
            <div id="category-nav-list" class="scroll-nav-row">
                <!-- 由 JS 根據選定的品牌動態彈出分類 -->
            </div>
        </div>
    </div>

    <!-- 主要商品展示網格區 -->
    <main class="menu-container">
        <!-- 讀取狀態圈圈 -->
        <div id="catalog-loading" class="loading-status">
            <div class="spinner"></div>
            <p>🐾 正在讀取商品資料...</p>
        </div>
        
        <!-- 商品卡片動態注入地基 -->
        <div id="products-grid" class="products-grid"></div>
    </main>

    <!-- 底部固定購物車捷徑列 -->
    <div class="sticky-footer">
        <div class="footer-hint">選擇商品資料即可加入暫存追加區</div>
        <button class="btn-cart-main" id="btn-go-cart">🛒 前往我的暫存車</button>
    </div>

    <!-- 確保 DOM 載入完畢才執行大腦 -->
    <script src="js/detail.js"></script>
</body>
</html>
