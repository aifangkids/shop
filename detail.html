<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail</title>
    
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/detail.css">
</head>
<body>

    <div id="page-transition" class="transition-overlay"></div>
    <div id="falling-container"></div>

<div class="top-bar">
    <a href="index.html" class="logo-link" id="back-home">
        <img src="images/ui/logo.png" alt="aifang" class="logo-img">
    </a>
    <div class="cart-box" id="cart-icon">
        <img src="./images/ui/icon_tcart.png" alt="購物車" class="cart-icon-img">
        <span class="cart-badge" id="cart-count">0</span>
    </div>
</div>

<div class="scrapbook-wrapper" id="detail-container">
    <div class="detail-main-container">
        
        <div class="left-panel" id="left-panel">
            <div class="detail-loading">故事書翻頁中...</div>
        </div>

        <div class="right-panel">
            </div>

    </div>
</div>
    </header>

    <main class="scrapbook-wrapper">
        <div class="scrapbook-container" id="detail-container">
            
            <div class="detail-main-container">
                
                <section class="left-panel">
                    <div id="polaroid-frame" class="polaroid-card">
                        <div class="polaroid-window">
                            <img id="product-extra-img" src="" alt="商品細節長圖">
                        </div>
                    </div>
                </section>

                <section class="right-panel">
                    <div class="memo-container">
                        <div class="product-header">
                            <span id="product-brand" class="brand-name"></span>
                            <h1 id="product-name" class="product-title">商品載入中</h1>
                        </div>

                        <div class="spec-section">
                            <h3 class="spec-label">顏色</h3>
                            <div id="color-options" class="option-pill-group"></div>
                        </div>

                        <div class="spec-section">
                            <div class="spec-label">尺寸</div>
    
                            <div class="size-row-container">
                                <div class="option-pill-group" id="size-options">
                                  </div>

                                <div class="size-guide-trigger" id="size-guide-btn">
                                    <img src="./images/ui/detail_sizeguide_btn.png" alt="查看尺寸表">
                                    <div class="size-guide-text">點擊對照魔法尺寸表 📏</div>
                                </div>
                            </div>
                        </div>

                        <div class="spec-section">
                            <h3 class="spec-label"></h3>
                            <p id="product-note" class="styling-note-text"></p>
                        </div>

                        <div id="buy-zone" class="buy-action-zone">
                            <button id="buy-now-btn" class="buy-capsule-button">BUY NOW</button>
                        </div>
                    </div>

                    <div class="price-sticker" style="background-image: url('images/ui/detail_price_tag.png');">
                        <span class="price-currency">NT$</span>
                        <span id="product-price" class="price-number">0</span>
                    </div>
                </section>
                
            </div>

        </div>
    </main>

    <div id="size-popup-overlay" class="popup-shadow-overlay">
        <div class="popup-window">
            <button id="close-size-popup" class="popup-close-x">✕</button>
            <div class="popup-scroll-box">
                <img id="popup-size-img" src="" alt="尺寸說明">
            </div>
        </div>
    </div>

    <script src="./js/api.js"></script>    
    <script src="./js/detail.js"></script>
</body>
</html>
