<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids - 訂單進度查詢</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/lookup.css">
</head>
<body>

    <div id="falling-container"></div>

    <div class="lookup-wrapper">
        <header class="lookup-card search-box-card">
            <h1 class="lookup-main-title">訂單進度查詢</h1>
            <p class="lookup-sub-desc">請輸入【手機號碼】或【專屬訂單編號】隨時追蹤動態</p>
            <form id="form-lookup" onsubmit="handleOrderLookup(event)">
                <div class="search-input-group">
                    <input type="text" id="ipt-keyword" class="lookup-input" placeholder="請輸入資料" required>
                    <button type="submit" id="btn-search" class="btn-lookup-submit">查詢 🔍</button>
                </div>
            </form>
        </header>

        <div id="lookup-results-container"></div>
    </div>

    <script>
        // 完全對齊您的後台 API 網址
        const GLOBAL_GAS_URL = "https://script.google.com/macros/s/AKfycbwrIptncgsBt4hAiRDniddghritIT8U9SXRvu8rTSY-t-LWYk4HoC7iQ_hGtaJLYIl5/exec";

        document.addEventListener("DOMContentLoaded", () => {
            // 自動偵測網址參數中的單號（相容從結帳頁自動跳轉帶入的 afid、uid 或 shippingId）
            const urlParams = new URLSearchParams(window.location.search);
            const urlAfid = urlParams.get("afid") || urlParams.get("uid") || urlParams.get("shippingId");
            if (urlAfid) {
                const inputField = document.getElementById("ipt-keyword");
                if (inputField) {
                    inputField.value = urlAfid;
                    executeLookup(urlAfid);
                }
            }
        });

        /**
         * 安全解析時間格式（100% 相容 iPhone Safari 瀏覽器）
         */
        function parseDateSafe(dateStr) {
            if (!dateStr) return new Date();
            // 將 "2026-07-06 10:17:00" 轉為 "2026/07/06 10:17:00" 避免 iOS 系統解析返回 NaN
            const formatted = String(dateStr).replace(/-/g, "/");
            return new Date(formatted);
        }

        /**
         * 表單提交觸發查詢（掛載於 window 確保 inline onsubmit="handleOrderLookup(event)" 可完全呼叫）
         */
        window.handleOrderLookup = function(event) {
            if (event) event.preventDefault();
            const keywordInput = document.getElementById("ipt-keyword");
            if (!keywordInput) return;

            const keyword = keywordInput.value.trim();
            if (!keyword) {
                alert("請輸入【手機號碼】或【專屬訂單編號】唷 🧸");
                return;
            }
            executeLookup(keyword);
        };

        /**
         * 執行查詢主核心
         */
        async function executeLookup(keyword) {
            const container = document.getElementById("lookup-results-container");
            if (!container) return;

            // 切換為載入中動畫狀態
            container.innerHTML = `
                <div style="text-align:center; padding: 40px 10px; color: #a89482;">
                    <div style="display:inline-block; width:30px; height:30px; border:3px solid #f3ebe1; border-top:3px solid #f2a6b2; border-radius:50%; animation:spin 1s linear infinite;"></div>
                    <p style="margin-top:15px; font-size: 13px;">🐾 正在努力連線後台，幫您翻找明細中...</p>
                </div>
            `;

            try {
                const response = await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "getOrderLookup", afid: keyword })
                });

                if (!response.ok) throw new Error("網路通訊異常");
                const result = await response.json();

                if (result.success && result.order) {
                    renderOrderCard(result.order, result.details);
                } else {
                    container.innerHTML = `
                        <div style="text-align:center; padding: 45px 15px; color: #c97a71; background: #fff5f5; border-radius: 12px; border: 1px dashed #e8dcd4; font-size: 13px;">
                            ❌ 找不到與「${keyword}」相關的訂單紀錄，請檢查號碼是否正確，或連繫 LINE 官方客服核對唷 🧸
                        </div>
                    `;
                }
            } catch (error) {
                console.error("查詢錯誤:", error);
                container.innerHTML = `
                    <div style="text-align:center; padding: 30px; color: #c97a71; font-size: 13px;">
                        🐾 後台塞車中或網路不穩，請稍等幾秒後再試一次！
                    </div>
                `;
            }
        }

        /**
         * 繪製訂單卡片 (包含24小時付款逾時判定與背景自動同步更新)
         */
        function renderOrderCard(order, details) {
            const container = document.getElementById("lookup-results-container");
            if (!container) return;

            container.innerHTML = "";

            // 1. 進行 24 小時付款時間差計算
            const orderTime = parseDateSafe(order.time).getTime(); // 訂單成立時間戳記
            const nowTime = new Date().getTime(); // 當前時間戳記
            const timeDiffMs = nowTime - orderTime; // 時間差毫秒數
            const timeDiffHrs = timeDiffMs / (1000 * 60 * 60); // 轉換為小時

            let displayStatus = order.orderstatus; // 預設使用後台傳回的狀態
            let showExpiredWarning = false;
            let countdownText = "";

            // 2. 判斷是否付款逾期：未填寫後五碼，且目前狀態還不是 paid 
            if (!order.lastfive && displayStatus !== "paid") {
                if (timeDiffHrs > 24) {
                    // 已經超時，直接強制前台顯示為已取消
                    displayStatus = "cancelled";
                    showExpiredWarning = true;
                    
                    // 🌟 樂觀背景自動同步：前台計算出逾期，自動發送更新請求，把 K 欄自動改為 cancelled，免去人工補點！
                    if (order.orderstatus !== "cancelled") {
                        silentlyCancelOrder(order.afid);
                    }
                } else {
                    // 尚未超時，計算剩餘小時與分鐘，展示倒數計時提醒客人
                    const totalRemainingMs = (24 * 60 * 60 * 1000) - timeDiffMs;
                    const remainingHrs = Math.floor(totalRemainingMs / (1000 * 60 * 60));
                    const remainingMins = Math.floor((totalRemainingMs % (1000 * 60 * 60)) / (1000 * 60));
                    countdownText = `⏳ 剩餘付款時間：${remainingHrs} 小時 ${remainingMins} 分鐘`;
                }
            }

            // 3. 定義訂單狀態對照與標籤樣式
            let statusChinese = "等待付款中";
            let statusClass = "status-unpaid";

            if (displayStatus === "paid") {
                statusChinese = "已付款待對帳";
                statusClass = "status-confirmed";
            } else if (displayStatus === "cancelled") {
                statusChinese = "已取消";
                statusClass = "status-cancelled";
            }

            // 4. 生成預購衣服明細 HTML 
            let itemsHtml = "";
            if (details && details.length > 0) {
                itemsHtml = `
                    <div style="margin-top: 15px; padding: 12px; background: #faf6f2; border-radius: 8px; border: 1px dashed #ebdcc5;">
                        <strong style="color: #735d4c; font-size: 13px;">📋 已預購商品明細：</strong>
                        <ul style="list-style: none; padding: 5px 0 0 0; margin: 0; font-size: 12px; line-height: 1.6;">
                            ${details.map(item => `
                                <li style="border-bottom: 1px solid #f2eae4; padding: 5px 0;">
                                    📌 ${item.code} | 規格: ${item.color} / ${item.size} | ${item.qty}件 | 小計: NT$ ${Number(item.total).toLocaleString()}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            // 5. 處理補填區或逾期警示區塊
            let bankActionHtml = "";
            if (displayStatus === "cancelled" || showExpiredWarning) {
                bankActionHtml = `
                    <div style="background-color: #fff5f5; border: 1px solid #d9534f; border-radius: 10px; padding: 15px; margin-top: 15px; font-size: 13px; color: #d9534f; line-height: 1.6;">
                        🚫 逾時付款，訂單自動取消。<br>
                        <small style="color: #a94442; font-size: 12px;">逾時付款，訂單自動取消，如需重新購買，請通知 LINE 官方客服，將為您協助處理。🧸</small>
                    </div>
                `;
            } else if (displayStatus !== "paid") {
                // 還沒付款，顯示補填框與倒數計時
                bankActionHtml = `
                    <div class="update-bank-box">
                        <div style="font-weight: bold; color: #735d4c; font-size: 13px; margin-bottom: 6px;">💰 補填匯款後五碼</div>
                        <div style="font-size: 11px; color: #e06c75; font-weight: bold; margin-bottom: 8px;">${countdownText}</div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="ipt-update-lastfive" class="lookup-input-mini" placeholder="請輸入 5 碼數字" maxlength="5">
                            <button onclick="window.updateLastFive('${order.afid}')" id="btn-five-${order.afid}" class="btn-lookup-mini">確認補填後五碼</button>
                        </div>
                        <small style="display:block; margin-top:6px; font-size: 11px; color: #baa38f;">💡 匯款後再填寫，避免造成核對失敗</small>
                    </div>
                `;
            } else {
                bankActionHtml = `
                    <div style="background-color: #f4f9f4; border: 1px solid #3c763d; border-radius: 10px; padding: 12px; margin-top: 15px; font-size: 12px; color: #3c763d;">
                        ✅ 已填寫匯款後五碼：<strong>${order.lastfive}</strong> (對帳處理中)
                    </div>
                `;
            }

            // 6. 組裝並渲染完整的漂亮卡片结构
            const card = document.createElement("div");
            card.className = "lookup-card result-card";
            card.style.cssText = "background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(216, 197, 183, 0.2); border: 1px solid #f2eae4; text-align: left; margin-top: 20px;";

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px dashed #f2eae4; padding-bottom:10px; margin-bottom:12px;">
                    <span style="font-weight:bold; color:#735d4c; font-size:14px;">🚚 單號：${order.afid}</span>
                    <span class="status-badge ${statusClass}">${statusChinese}</span>
                </div>
                <div style="font-size: 13px; color:#5a4b41; line-height: 1.6;">
                    <p><strong>收件人姓名：</strong>${order.name}</p>
                    <p><strong>LINE 名稱：</strong>${order.line}</p>
                    <p><strong>手機號碼：</strong>${order.phone}</p>
                    <p><strong>配送超商：</strong>${order.shipping} (${order.store})</p>
                    <p style="margin-top: 6px; font-size: 14px;"><strong>合計金額：</strong><span style="color:#b06249; font-weight:bold; font-size:16px;">NT$ ${Number(order.total).toLocaleString()}</span></p>
                    
                    ${itemsHtml}
                    ${bankActionHtml}
                </div>
            `;

            container.appendChild(card);
        }

        /**
         * 非同步背景自動更新訂單狀態為 cancelled
         */
        async function silentlyCancelOrder(afid) {
            try {
                await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "updateOrderStatus",
                        afid: afid,
                        status: "cancelled"
                    })
                });
            } catch (e) {
                console.error("背景自動取消訂單發生連線錯誤:", e);
            }
        }

        /**
         * 提交匯款後五碼並更新試算表（掛載於 window 確保行內 onclick 可完美呼叫）
         */
        window.updateLastFive = async function(afid) {
            const inputField = document.getElementById("ipt-update-lastfive");
            const btn = document.getElementById(`btn-five-${afid}`);
            if (!inputField) return;

            const code = inputField.value.trim();
            if (!code || code.length !== 5 || isNaN(code)) {
                alert("請輸入正確的 5 位數銀行帳號後 5 碼唷 🧸");
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = "⏳";
            }

            try {
                const response = await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "updateLastFive",
                        afid: afid,
                        lastfive: code
                    })
                });

                const resData = await response.json();

                if (resData.success) {
                    alert("🎉 匯款後五碼已成功補填更新！璦坊會立刻幫您對帳，謝謝您 🧸");
                    // 重新執行查詢，即時刷新畫面
                    executeLookup(afid);
                } else {
                    alert("更新失敗：" + resData.message);
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = "確認補填後五碼";
                    }
                }
            } catch (err) {
                console.error("更新後五碼連線失敗:", err);
                alert("哎呀，後台塞車中，請稍候再試一次唷！");
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "確認補填後五碼";
                }
            }
        };
    </script>
</body>
</html>
