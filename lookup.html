<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* ==========================================================================
           1. ⚠️ 【鐵律置頂】字體與全域基礎設定 (確保 100% 吃進字體)
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        @font-face {
            font-family: 'CutieStar';
            src: url('./assets/fonts/Cutie-Star.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            /* 品牌配色與視覺地基底色 */
            --bg-main: #FFF9EF;        
            --baby-pink: #f2a6b2;
            --kids-blue: #8da9c4;
            --accent-red: #d9534f;
            --text-main: #333;
            --text-gray: #888;
            --font-main: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* 確保全域所有元件（包含動態塞入的訂單卡片）都 100% 強制吃進 Noto Sans KR */
        *, body, input, select, button, textarea, span, div, p, h2, h3, h4, li, label, option { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; /* 去除手機點擊陰影 */
            font-family: var(--font-main) !important;
        }

        /* 唯獨最上方的品牌 Logo 維持 CutieStar */
        .lookup-main-title {
            font-family: 'CutieStar', sans-serif !important;
            color: var(--baby-pink);
            font-size: 50px;
            margin-bottom: 8px;
        }

        body { 
            color: var(--text-main);
            background-color: var(--bg-main);
            line-height: 1.6;
            overflow-x: hidden; /* 防止動態粒子造成的水平捲軸 */
            padding: 20px 10px;
        }

        /* ==========================================================================
           2. 通用元件 - 按鈕
           ========================================================================== */
        .btn-common {
            padding: 12px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: opacity 0.3s ease;
        }

        .btn-common:hover {
            opacity: 0.8;
        }

        /* ==========================================================================
           3. 動態粒子飄落系統 
           ========================================================================== */
        #falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none; 
            z-index: -1;          
        }

        .particle {
            position: absolute;
            top: -60px; /* 從視窗上方外面開始掉落 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            opacity: 0;
            animation: slowFall linear forwards;
        }

        @keyframes slowFall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.65; /* 漸漸浮現，避免太突兀，維持背景柔和感 */
            }
            90% {
                opacity: 0.65;
            }
            100% {
                /* 掉落到視窗下方，並帶有隨機的左右物理飄移與旋轉 */
                transform: translateY(108vh) translateX(var(--drift-x)) rotate(var(--drift-rotate));
                opacity: 0;
            }
        }

        /* ==========================================================================
           4. 訂單查詢卡片與美型狀態標籤樣式
           ========================================================================== */
        .lookup-wrapper {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        
        .lookup-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(216, 197, 183, 0.2);
            border: 1px solid #f2eae4;
            margin-bottom: 20px;
        }

        .search-box-card {
            margin-top: 10px;
        }

        .lookup-sub-desc {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
        }

        .lookup-input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid #dcd0c4;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fdfdfd;
            outline: none;
            transition: border-color 0.2s;
        }

        .lookup-input:focus {
            border-color: var(--baby-pink);
        }

        .btn-lookup-submit {
            background-color: var(--baby-pink);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-lookup-submit:hover {
            opacity: 0.9;
        }

        /* 👑 狀態標籤美化設計 👑 */
        .status-badge {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            display: inline-block;
        }
        
        /* new（已建立，未付款） */
        .status-new {
            background-color: #fff2cc;
            color: #7f6000;
        }
        
        /* paid（已付款） */
        .status-paid {
            background-color: #e2f0d9;
            color: #385723;
        }

        /* shipped（已出貨） */
        .status-shipped {
            background-color: #d9e1f2;
            color: #1f4e79;
        }

        /* completed（完成） */
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        
        /* cancelled（取消） */
        .status-cancelled {
            background-color: #fce4d6;
            color: #c65911;
        }

        /* refunded（已退款） */
        .status-refunded {
            background-color: #e8daef;
            color: #6c3483;
        }

        /* 補填後五碼資訊區 */
        .update-bank-box {
            margin-top: 15px;
            padding: 15px;
            background: #faf4ee;
            border: 1px dashed #d9c5b6;
            border-radius: 10px;
        }

        .btn-lookup-mini {
            background: #8c725e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-lookup-mini:hover {
            background: #735d4c;
        }

        .lookup-input-mini {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #dcd0c4;
            border-radius: 6px;
            font-size: 13px;
            color: #5a4b41;
            outline: none;
        }

        /* 💰 匯款資訊卡專屬微調（溫馨粉嫩奶油排版） */
        .bank-info-card {
            background-color: #faf4ee;
            border: 1px dashed #d9c5b6;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            margin-top: 6px;
            text-align: left;
        }

        .bank-title-text {
            font-weight: bold;
            font-size: 1rem;
            color: #735d4c;
            margin-bottom: 8px;
        }

        .bank-detail-text {
            font-size: 0.9rem;
            color: #615043;
            line-height: 1.6;
        }

        .bank-deadline-alert {
            margin-top: 10px;
            color: #b3563e; /* 溫和的警示紅褐色 */
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* 📜 店鋪條款政策清單樣式 */
        .shop-policy-list {
            margin: 15px 0;
            padding-top: 12px;
            border-top: 1px solid #f2eae4;
            list-style-position: inside;
            text-align: left;
        }

        .shop-policy-item {
            font-size: 0.85rem;
            color: #8c7769;
            margin-bottom: 6px;
            position: relative;
            padding-left: 5px;
            list-style-type: none;
        }
        .shop-policy-item::before {
            content: "• ";
            color: var(--baby-pink);
            font-weight: bold;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ==========================================================================
           5. 手機響應式通用微調 (RWD)
           ========================================================================== */
        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            
            .lookup-card { 
                padding: 20px 15px; 
                border-radius: 12px; 
            }
            
            .search-input-group {
                flex-direction: column;
                gap: 8px;
            }

            .btn-lookup-submit {
                padding: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 🌸 浪漫粒子背景容器 -->
    <div id="falling-container"></div>

    <div class="lookup-wrapper">
        <header class="lookup-card search-box-card">
            <h1 class="lookup-main-title">Aifang kids</h1>
            <p class="lookup-sub-desc">請輸入專屬訂單編號 (例如: af95294390)</p>
            <p class="lookup-sub-desc">忘記編號，可以聯繫 LINE 官方客服協助處理</p>

            <form id="form-lookup" onsubmit="handleOrderLookup(event)">
                <div class="search-input-group">
                    <input type="text" id="ipt-keyword" class="lookup-input" placeholder="請輸入專屬訂單編號" required>
                    <button type="submit" id="btn-search" class="btn-lookup-submit">查詢</button>
                </div>
            </form>
        </header>

        <!-- 查詢結果會動態渲染於此 -->
        <div id="lookup-results-container"></div>
    </div>

    <!-- ==========================================================================
         🌸 6. 整合大腦 JavaScript 邏輯 ( lookup.js + 動態粒子 )
         ========================================================================== */ -->
    <script>
        // 對接老闆娘最新發布的後台網址 (完美使用儲存的 api_url 紀錄)
        const GLOBAL_GAS_URL = "https://script.google.com/macros/s/AKfycbwrIptncgsBt4hAiRDniddghritIT8U9SXRvu8rTSY-t-LWYk4HoC7iQ_hGtaJLYIl5/exec";

        document.addEventListener("DOMContentLoaded", () => {
            // 1. 自動偵測網址參數中的單號（相容從結帳頁自動跳轉帶入的 afid、uid 或 shippingId）
            const urlParams = new URLSearchParams(window.location.search);
            const urlAfid = urlParams.get("afid") || urlParams.get("uid") || urlParams.get("shippingId");
            if (urlAfid) {
                const inputField = document.getElementById("ipt-keyword");
                if (inputField) {
                    inputField.value = urlAfid;
                    executeLookup(urlAfid);
                }
            }

            // 2. 啟動櫻花飄落粒子系統
            initFallingParticles();
        });

        /**
         * 安全解析時間格式（100%相容 iPhone Safari 瀏覽器）
         */
        function parseDateSafe(dateStr) {
            if (!dateStr) return new Date();
            // 將 "2026-07-06 10:17:00" 轉為 "2026/07/06 10:17:00" 避免 iOS 系統解析返回 NaN 導致倒數功能壞掉
            const formatted = String(dateStr).replace(/-/g, "/");
            return new Date(formatted);
        }

        /**
         * 表單提交觸發查詢
         */
        window.handleOrderLookup = function(event) {
            if (event) event.preventDefault();
            const keyword = document.getElementById("ipt-keyword").value.trim();
            if (!keyword) return;
            executeLookup(keyword);
        };

        /**
         * 執行查詢核心 API
         */
        async function executeLookup(keyword) {
            const container = document.getElementById("lookup-results-container");
            container.innerHTML = `
                <div class="lookup-card" style="text-align: center; padding: 40px 20px;">
                    <div style="width:36px; height:36px; border:3px solid #f3ebe1; border-top:3px solid var(--baby-pink); border-radius:50%; animation: spin 1s linear infinite; margin: 0 auto 12px auto;"></div>
                    <p style="font-size:13px; color:#a89482;">🐾 連線至訂單系統，為您查詢預購商品，請稍候片刻</p>
                </div>
            `;

            try {
                // 使用 POST 請求，確保參數透過 payload 精準發送給 GAS 
                const response = await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "getOrderLookup", afid: keyword })
                });

                if (!response.ok) throw new Error("網路通訊異常");
                const result = await response.json();

                if (result.success && result.order) {
                    renderOrderCard(result.order, result.details);
                } else {
                    container.innerHTML = `
                        <div class="lookup-card" style="text-align: center; padding: 40px 20px; color: var(--accent-red); font-size:13px;">
                            ❌ 找不到與「${keyword}」相關的訂單紀錄，請檢查編號是否正確，或連繫 LINE 官方客服協助處理
                        </div>
                    `;
                }
            } catch (error) {
                console.error("查詢錯誤:", error);
                container.innerHTML = `
                    <div class="lookup-card" style="text-align: center; padding: 40px 20px; color: var(--accent-red); font-size:13px;">
                        🐾 訂單系統網路不穩，請稍等再試
                    </div>
                `;
            }
        }

        /**
         * 繪製訂單卡片 (包含24小時付款逾時判定與背景自動同步更新)
         */
        function renderOrderCard(order, details) {
            const container = document.getElementById("lookup-results-container");
            if (!container) return;

            container.innerHTML = "";

            // 1. 進行 24 小時付款時間差計算
            const orderTime = parseDateSafe(order.time).getTime(); // 訂單成立時間戳記
            const nowTime = new Date().getTime(); // 當前時間戳記
            const timeDiffMs = nowTime - orderTime; // 時間差毫秒數
            const timeDiffHrs = timeDiffMs / (1000 * 60 * 60); // 轉換為小時

            let displayStatus = order.orderstatus; // 預設使用後台傳回的狀態
            let showExpiredWarning = false;
            let countdownText = "";

            // 判斷是否屬於已核對付款/後續流程狀態 (paid, shipped, completed, refunded)
            const isPaymentResolved = ["paid", "shipped", "completed", "refunded"].includes(displayStatus);

            // 2. 判斷是否付款逾期：未填寫後五碼，且目前狀態還不是任何付款完成、出貨、完成或退款狀態
            if (!order.lastfive && !isPaymentResolved) {
                if (timeDiffHrs > 24) {
                    // 已經超時，直接強制前台顯示為已取消
                    displayStatus = "cancelled";
                    showExpiredWarning = true;
                    
                    // 🌟 樂觀背景自動同步：前台計算出逾期，自動發送更新請求，把 K 欄自動改為 cancelled，免去人工補點！
                    if (order.orderstatus !== "cancelled") {
                        silentlyCancelOrder(order.afid);
                    }
                } else {
                    // 尚未超時，計算剩餘小時與分鐘，展示倒數計時提醒客人
                    const hoursLeft = Math.floor(24 - timeDiffHrs);
                    const minutesLeft = Math.floor((60 - ((timeDiffMs / (1000 * 60)) % 60)) % 60);
                    countdownText = `⏳ 剩餘付款時間：${hoursLeft} 小時 ${minutesLeft} 分鐘`;
                }
            }

            // 3. 🎯 狀態對照 (完美對接老闆娘要求的 6 種電商狀態與對照中文)
            let statusChinese = "等待付款中";
            let statusClass = "status-new";

            switch (displayStatus) {
                case "new":
                    statusChinese = "已建立，未付款";
                    statusClass = "status-new";
                    break;
                case "paid":
                    statusChinese = "已付款";
                    statusClass = "status-paid";
                    break;
                case "shipped":
                    statusChinese = "已出貨";
                    statusClass = "status-shipped";
                    break;
                case "completed":
                    statusChinese = "完成";
                    statusClass = "status-completed";
                    break;
                case "cancelled":
                    statusChinese = "取消";
                    statusClass = "status-cancelled";
                    break;
                case "refunded":
                    statusChinese = "已退款";
                    statusClass = "status-refunded";
                    break;
                default:
                    statusChinese = "已建立，未付款";
                    statusClass = "status-new";
                    break;
            }

            // 4. 生成預購衣服明細 HTML 
            let itemsHtml = "";
            if (details && details.length > 0) {
                itemsHtml = `
                    <div style="margin-top: 15px; padding: 12px; background: #faf6f2; border-radius: 8px; border: 1px solid #ebdcc5; text-align: left;">
                        <strong style="color: #735d4c; font-size: 13px;">📦 預購商品明細：</strong>
                        <ul style="list-style: none; padding-left: 0; margin-top: 6px; font-size: 12.5px; color: #5a4b41; display:flex; flex-direction:column; gap:6px;">
                            ${details.map(item => `
                                <li style="border-bottom: 1px dashed #f2eae4; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
                                    <span> <b>${item.code}</b> | ${item.color} | ${item.size}</span>
                                    <span>${item.qty}件 · NT$ ${Number(item.total).toLocaleString()}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            // 5. 處理補填區、匯款卡、條款政策之分流顯示
            let bankActionHtml = "";
            if (displayStatus === "cancelled" || showExpiredWarning) {
                bankActionHtml = `
                    <div style="background-color: #fff5f5; border: 1px solid #d9534f; border-radius: 10px; padding: 15px; margin-top: 15px; font-size: 13px; color: #d9534f; line-height: 1.6; text-align: center;">
                        🚫 逾時付款，訂單自動取消<br>
                        <small style="color: #a94442; font-size: 12px; display:block; margin-top:4px;">逾時付款，訂單自動取消，如需重新購買，請通知 LINE 官方客服，將為您協助處理</small>
                    </div>
                `;
            } else if (displayStatus === "refunded") {
                // 已退款狀態：隱藏填寫框，但帶出退款說明與條款提醒
                bankActionHtml = `
                    <div style="background-color: #faf2f5; border: 1px solid #9b59b6; border-radius: 10px; padding: 15px; margin-top: 15px; font-size: 13px; color: #8e44ad; line-height: 1.6; text-align: center; margin-bottom: 15px;">
                        ℹ️ 此訂單已完成退款<br>
                        <small style="color: #7d3c98; font-size: 12px; display:block; margin-top:4px;">退款金額已返還至您的指定帳戶，若有對帳需求，請聯繫 LINE 官方客服</small>
                    </div>

                    <!-- 小條款政策清單 -->
                    <ul class="shop-policy-list">
                        <li class="shop-policy-item">商品金額已含營業稅</li>
                        <li class="shop-policy-item">取貨時請務必攜帶與收件人姓名相同的證件</li>
                        <li class="shop-policy-item">依《消費者保護法》規範，享有七天鑑賞期退換貨服務</li>
                        <li class="shop-policy-item">退換貨商品須保持全新、未剪標且完整包裝</li>
                    </ul>
                `;
            } else if (!isPaymentResolved) {
                // 還沒付款 (new / 未付款)，顯示補填框、公司匯款卡、倒數計時與條款
                bankActionHtml = `
                    <!-- 匯款資訊卡 -->
                    <div class="bank-info-card">
                        <div class="bank-title-text">匯款資訊</div>
                        <div class="bank-detail-text">
                            <strong>戶名：</strong>璦坊童裝<br>
                            <strong>銀行：</strong>103 臺灣新光商業銀行<br>
                            <strong>分行：</strong>0675 斗六分行<br>
                            <strong>帳號：</strong>0675101004736
                        </div>
                        <div class="bank-deadline-alert">請於 24 小時之內完成匯款，逾時視同放棄訂單</div>
                    </div>

                    <div class="update-bank-box">
                        <div style="font-weight: bold; color: #735d4c; font-size: 13px; margin-bottom: 6px;">填寫匯款帳號後五碼</div>
                        <div style="font-size: 11px; color: #e06c75; font-weight: bold; margin-bottom: 8px;">${countdownText}</div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="ipt-update-lastfive" class="lookup-input-mini" placeholder="請輸入匯款帳號後 5 碼" maxlength="5">
                            <button onclick="window.updateLastFive('${order.afid}')" id="btn-five-${order.afid}" class="btn-lookup-mini">確認送出</button>
                        </div>
                        <small style="display:block; margin-top:6px; font-size: 11px; color: #baa38f;">💡 給予對方的備註請勿填寫，以免不利核對帳號與金額</small>
                    </div>

                    <!-- 小條款政策清單 -->
                    <ul class="shop-policy-list">
                        <li class="shop-policy-item">商品金額已含營業稅</li>
                        <li class="shop-policy-item">取貨時請務必攜帶與收件人姓名相同的證件</li>
                        <li class="shop-policy-item">依《消費者保護法》規範，享有七天鑑賞期退換貨服務</li>
                        <li class="shop-policy-item">退換貨商品須保持全新、未剪標且完整包裝</li>
                    </ul>
                `;
            } else {
                // 已確認付款狀態 (paid, shipped, completed)：隱藏匯款卡與填寫框，但依闆娘要求，卡片下方「直接帶出小政策條款」
                const verifiedCode = order.lastfive ? ` (後五碼: <strong>${order.lastfive}</strong>)` : "";
                bankActionHtml = `
                    <div style="background-color: #f4f9f4; border: 1px solid #3c763d; border-radius: 10px; padding: 12px; margin-top: 15px; font-size: 12px; color: #3c763d; text-align: center; margin-bottom: 15px;">
                        ✅ 訂單已核對付款狀態${verifiedCode}
                    </div>

                    <!-- 小條款政策清單 -->
                    <ul class="shop-policy-list">
                        <li class="shop-policy-item">商品金額已含營業稅</li>
                        <li class="shop-policy-item">取貨時請務必攜帶與收件人姓名相同的證件</li>
                        <li class="shop-policy-item">依《消費者保護法》規範，享有七天鑑賞期退換貨服務</li>
                        <li class="shop-policy-item">退換貨商品須保持全新、未剪標且完整包裝</li>
                    </ul>
                `;
            }

            // 6. 渲染完整卡片結構
            const card = document.createElement("div");
            card.className = "lookup-card result-card";
            card.style.cssText = "background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(216, 197, 183, 0.2); border: 1px solid #f2eae4; text-align: left; margin-top: 20px;";

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px dashed #f2eae4; padding-bottom:10px; margin-bottom:12px;">
                    <span style="font-weight:bold; color:#735d4c; font-size:14px;">專屬訂單編號：${order.afid}</span>
                    <span class="status-badge ${statusClass}">${statusChinese}</span>
                </div>
                <div style="font-size: 13px; color:#5a4b41; line-height: 1.65;">
                    <p><strong>收件人姓名：</strong>${order.name}</p>
                    <p><strong>LINE 名稱：</strong>${order.line}</p>
                    <p><strong>手機號碼：</strong>${order.phone}</p>
                    <p><strong>配送超商：</strong>${order.shipping} (${order.store})</p>
                    <p style="margin-top: 6px; font-size: 14px;"><strong>合計金額：</strong><span style="color:#b06249; font-weight:bold; font-size:16px;">NT$ ${Number(order.total).toLocaleString()}</span></p>
                    
                    ${itemsHtml}
                    ${bankActionHtml}
                </div>
            `;

            container.appendChild(card);
        }

        /**
         * 非同步背景自動更新訂單狀態為 cancelled
         */
        async function silentlyCancelOrder(afid) {
            try {
                await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "updateOrderStatus",
                        afid: afid,
                        status: "cancelled"
                    })
                });
            } catch (e) {
                console.error("背景自動取消訂單發生連線錯誤:", e);
            }
        }

        /**
         * 提交匯款後五碼並更新試算表（掛載於 window 確保行內 onclick 可完美呼叫）
         */
        window.updateLastFive = async function(afid) {
            const inputField = document.getElementById("ipt-update-lastfive");
            const btn = document.getElementById(`btn-five-${afid}`);
            if (!inputField) return;

            const code = inputField.value.trim();
            if (!code || code.length !== 5 || isNaN(code)) {
                alert("請輸入匯款帳號後 5 碼");
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = "⏳";
            }

            try {
                const response = await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "updateLastFive",
                        afid: afid,
                        lastfive: code
                    })
                });

                const resData = await response.json();

                if (resData.success) {
                    alert("🎉 匯款帳號後五碼已更新！會立刻幫您對帳");
                    // 重新執行查詢，即時刷新畫面
                    executeLookup(afid);
                } else {
                    alert("更新失敗：" + resData.message);
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = "確認匯款帳號後五碼";
                    }
                }
            } catch (err) {
                console.error("更新後五碼連線失敗:", err);
                alert("訂單系統連線不穩，請稍候再試");
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "確認匯款帳號後五碼";
                }
            }
        };

    </script>
    <script src="js/articles.js"></script>
