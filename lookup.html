<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* ==========================================================================
           1. ⚠️ 【鐵律置頂】字體與全域基礎設定 (確保 100% 吃進字體)
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        @font-face {
            font-family: 'CutieStar';
            src: url('./assets/fonts/Cutie-Star.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            /* 品牌配色與視覺地基底色 */
            --bg-main: #FFF9EF;        
            --baby-pink: #f2a6b2;
            --kids-blue: #8da9c4;
            --accent-red: #d9534f;
            --text-main: #333;
            --text-gray: #888;
            --font-main: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* 確保全域所有元件（包含動態塞入的訂單卡片）都 100% 強制吃進 Noto Sans KR */
        *, body, input, select, button, textarea, span, div, p, h2, h3, h4, li, label, option { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; /* 去除手機點擊陰影 */
            font-family: var(--font-main) !important;
        }

        /* 唯獨最上方的品牌 Logo 維持 CutieStar */
        .lookup-main-title {
            font-family: 'CutieStar', sans-serif !important;
            color: var(--baby-pink);
            font-size: 50px;
            margin-bottom: 8px;
        }

        body { 
            color: var(--text-main);
            background-color: var(--bg-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* ==========================================================================
           2. 通用元件 - 按鈕
           ========================================================================== */
        .btn-common {
            padding: 12px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: opacity 0.3s ease;
        }

        .btn-common:hover {
            opacity: 0.8;
        }

        /* ==========================================================================
           4. 訂單查詢卡片與美型狀態標籤樣式
           ========================================================================== */
        .lookup-wrapper {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        
        .lookup-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(216, 197, 183, 0.2);
            border: 1px solid #f2eae4;
            margin-bottom: 20px;
        }

        .search-box-card {
            margin-top: 10px;
        }

        .lookup-sub-desc {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
        }

        .lookup-input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid #dcd0c4;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fdfdfd;
            outline: none;
            transition: border-color 0.2s;
        }

        .lookup-input:focus {
            border-color: var(--baby-pink);
        }

        .btn-lookup-submit {
            background-color: var(--baby-pink);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-lookup-submit:hover {
            opacity: 0.9;
        }

        /* 👑 狀態標籤美化設計 👑 */
        .status-badge {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            display: inline-block;
        }
        
        /* new（已建立，未付款） */
        .status-new {
            background-color: #fff2cc;
            color: #7f6000;
        }
        
        /* paid（已付款） */
        .status-paid {
            background-color: #e2f0d9;
            color: #385723;
        }

        /* shipped（已出貨） */
        .status-shipped {
            background-color: #d9e1f2;
            color: #1f4e79;
        }

        /* completed（完成） */
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        
        /* cancelled（取消） */
        .status-cancelled {
            background-color: #fce4d6;
            color: #c65911;
        }

        /* refunded（已退款） */
        .status-refunded {
            background-color: #e8daef;
            color: #6c3483;
        }

        /* 補填後五碼資訊區 */
        .update-bank-box {
            margin-top: 15px;
            padding: 15px;
            background: #faf4ee;
            border: 1px dashed #d9c5b6;
            border-radius: 10px;
        }

        .btn-lookup-mini {
            background: #8c725e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-lookup-mini:hover {
            background: #735d4c;
        }

        .lookup-input-mini {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #dcd0c4;
            border-radius: 6px;
            font-size: 13px;
            color: #5a4b41;
            outline: none;
        }

        /* 📜 店鋪條款政策清單樣式 */
        .shop-policy-list {
            margin: 15px 0;
            padding-top: 12px;
            border-top: 1px solid #f2eae4;
            list-style-position: inside;
            text-align: left;
        }

        .shop-policy-item {
            font-size: 0.85rem;
            color: #8c7769;
            margin-bottom: 6px;
            position: relative;
            padding-left: 5px;
            list-style-type: none;
        }
        .shop-policy-item::before {
            content: "• ";
            color: var(--baby-pink);
            font-weight: bold;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ==========================================================================
           5. 手機響應式通用微調 (RWD)
           ========================================================================== */
        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            
            .lookup-card { 
                padding: 20px 15px; 
                border-radius: 12px; 
            }
            
            .search-input-group {
                flex-direction: column;
                gap: 8px;
            }

            .btn-lookup-submit {
                padding: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="lookup-wrapper">
        <header class="lookup-card search-box-card">
            <h1 class="lookup-main-title">Aifang kids</h1>
            <p class="lookup-sub-desc">請輸入專屬訂單編號</p>
            <p class="lookup-sub-desc">忘記編號，可以聯繫 LINE 官方客服協助處理</p>

            <form id="form-lookup" onsubmit="handleOrderLookup(event)">
                <div class="search-input-group">
                    <input type="text" id="ipt-keyword" class="lookup-input" placeholder="請輸入專屬訂單編號" required>
                    <button type="submit" id="btn-search" class="btn-lookup-submit">查詢</button>
                </div>
            </form>
        </header>

        <!-- 查詢結果會動態渲染於此 -->
        <div id="lookup-results-container"></div>
    </div>

    <!-- ==========================================================================
         🌸 6. 整合大腦 JavaScript 邏輯 ( lookup.js )
         ========================================================================== */ -->
    <script>
        // 對接老闆娘最新發布的後台網址 (完美使用儲存的 api_url 紀錄)
        const GLOBAL_GAS_URL = "https://script.google.com/macros/s/AKfycbwrIptncgsBt4hAiRDniddghritIT8U9SXRvu8rTSY-t-LWYk4HoC7iQ_hGtaJLYIl5/exec";

        document.addEventListener("DOMContentLoaded", () => {
            // 1. 自動偵測網址參數中的單號（相容從結帳頁自動跳轉帶入的 afid、uid 或 shippingId）
            const urlParams = new URLSearchParams(window.location.search);
            const urlAfid = urlParams.get("afid") || urlParams.get("uid") || urlParams.get("shippingId");
            if (urlAfid) {
                const inputField = document.getElementById("ipt-keyword");
                if (inputField) {
                    inputField.value = urlAfid;
                    executeLookup(urlAfid);
                }
            }
        });

        /**
         * 安全解析時間格式（100%相容 iPhone Safari 瀏覽器）
         */
        function parseDateSafe(dateStr) {
            if (!dateStr) return new Date();
            const formatted = String(dateStr).replace(/-/g, "/");
            return new Date(formatted);
        }

        /**
         * 表單提交觸發查詢
         */
        window.handleOrderLookup = function(event) {
            if (event) event.preventDefault();
            const keyword = document.getElementById("ipt-keyword").value.trim();
            if (!keyword) return;
            executeLookup(keyword);
        };

        /**
         * 執行查詢核心 API
         */
        async function executeLookup(keyword) {
            const container = document.getElementById("lookup-results-container");
            container.innerHTML = `
                <div class="lookup-card" style="text-align: center; padding: 40px 20px;">
                    <div style="width:36px; height:36px; border:3px solid #f3ebe1; border-top:3px solid var(--baby-pink); border-radius:50%; animation: spin 1s linear infinite; margin: 0 auto 12px auto;"></div>
                    <p style="font-size:13px; color:#a89482;">🐾 連線至訂單系統，為您查詢預購商品，請稍候片刻</p>
                </div>
            `;

            try {
                const response = await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "getOrderLookup", afid: keyword })
                });

                if (!response.ok) throw new Error("網路通訊異常");
                const result = await response.json();

                if (result.success && result.order) {
                    renderOrderCard(result.order, result.details);
                } else {
                    container.innerHTML = `
                        <div class="lookup-card" style="text-align: center; padding: 40px 20px; color: var(--accent-red); font-size:13px;">
                            ❌ 找不到與「${keyword}」相關的訂單紀錄，請檢查編號是否正確，或連繫 LINE 官方客服協助處理
                        </div>
                    `;
                }
            } catch (error) {
                console.error("查詢錯誤:", error);
                container.innerHTML = `
                    <div class="lookup-card" style="text-align: center; padding: 40px 20px; color: var(--accent-red); font-size:13px;">
                        🐾 訂單系統網路不穩，請稍等再試
                    </div>
                `;
            }
        }

        /**
         * 繪製訂單卡片 (包含24小時付款逾時判定與背景自動同步更新)
         */
        function renderOrderCard(order, details) {
            const container = document.getElementById("lookup-results-container");
            if (!container) return;

            container.innerHTML = "";

            // 1. 進行 24 小時付款時間差計算
            const orderTime = parseDateSafe(order.time).getTime(); 
            const nowTime = new Date().getTime(); 
            const timeDiffMs = nowTime - orderTime; 
            const timeDiffHrs = timeDiffMs / (1000 * 60 * 60); 

            let displayStatus = order.orderstatus; 
            const isPaymentResolved = ["paid", "shipped", "completed", "refunded"].includes(displayStatus);

            // 2. 判斷是否付款逾期
            if (!order.lastfive && !isPaymentResolved) {
                if (timeDiffHrs > 24) {
                    displayStatus = "cancelled";
                    if (order.orderstatus !== "cancelled") {
                        silentlyCancelOrder(order.afid);
                    }
                }
            }

            // 3. 🎯 狀態對照 (完美對接老闆娘要求的 6 種電商狀態與對照中文)
            let statusChinese = "等待付款中";
            let statusClass = "status-new";

            switch (displayStatus) {
                case "new":
                    statusChinese = "已建立，未付款";
                    statusClass = "status-new";
                    break;
                case "paid":
                    statusChinese = "已付款";
                    statusClass = "status-paid";
                    break;
                case "shipped":
                    statusChinese = "已出貨";
                    statusClass = "status-shipped";
                    break;
                case "completed":
                    statusChinese = "完成";
                    statusClass = "status-completed";
                    break;
                case "cancelled":
                    statusChinese = "取消";
                    statusClass = "status-cancelled";
                    break;
                case "refunded":
                    statusChinese = "已退款";
                    statusClass = "status-refunded";
                    break;
                default:
                    statusChinese = "已建立，未付款";
                    statusClass = "status-new";
                    break;
            }

            // 4. 生成預購衣服明細 HTML (加入商品主圖 imagemain)
            let itemsHtml = "";
            if (details && details.length > 0) {
                itemsHtml = `
                    <div style="margin-top: 15px; padding: 12px; background: #faf6f2; border-radius: 8px; border: 1px solid #ebdcc5; text-align: left;">
                        <strong style="color: #735d4c; font-size: 13px;">📦 預購商品明細：</strong>
                        <ul style="list-style: none; padding-left: 0; margin-top: 6px; font-size: 12.5px; color: #5a4b41; display:flex; flex-direction:column; gap:6px;">
                            ${details.map(item => `
                                <li style="border-bottom: 1px dashed #f2eae4; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        ${item.imagemain ? `<img src="${item.imagemain}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;" alt="商品圖片">` : ''}
                                        <span> <b>${item.code}</b> | ${item.color} | ${item.size}</span>
                                    </div>
                                    <span>${item.qty}件 · NT$ ${Number(item.total).toLocaleString()}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            // 6. 渲染完整卡片結構
            const card = document.createElement("div");
            card.className = "lookup-card result-card";
            card.style.cssText = "background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(216, 197, 183, 0.2); border: 1px solid #f2eae4; text-align: left; margin-top: 20px;";

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px dashed #f2eae4; padding-bottom:10px; margin-bottom:12px;">
                    <span style="font-weight:bold; color:#735d4c; font-size:14px;">專屬訂單編號：${order.afid}</span>
                    <span class="status-badge ${statusClass}">${statusChinese}</span>
                </div>
                <div style="font-size: 13px; color:#5a4b41; line-height: 1.65;">
                    <p><strong>收件人姓名：</strong>${order.name}</p>
                    <p><strong>LINE 名稱：</strong>${order.line}</p>
                    <p><strong>手機號碼：</strong>${order.phone}</p>
                    <p><strong>配送超商：</strong>${order.shipping} (${order.store})</p>
                    <p style="margin-top: 6px; font-size: 14px;"><strong>合計金額：</strong><span style="color:#b06249; font-weight:bold; font-size:16px;">NT$ ${Number(order.total).toLocaleString()}</span></p>
                    
                    ${itemsHtml}
                </div>
            `;

            container.appendChild(card);
        }

        /**
         * 非同步背景自動更新訂單狀態為 cancelled
         */
        async function silentlyCancelOrder(afid) {
            try {
                await fetch(GLOBAL_GAS_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "updateOrderStatus",
                        afid: afid,
                        status: "cancelled"
                    })
                });
            } catch (e) {
                console.error("背景自動取消訂單發生連線錯誤:", e);
            }
        }

    </script>
</body>
</html>
