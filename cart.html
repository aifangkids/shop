<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
    <link rel="stylesheet" href="assets/css/global.css">    
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

    <div class="cart-wrapper">
        
        <div class="cart-left-panel">
            <div class="memo-card-main1">
                <h2 class="form-title">訂單資訊</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="customername">LINE 姓名</label>
                        <input type="text" id="customername" required placeholder="請輸入您的 LINE 暱稱">
                    </div>

                    <div class="form-group">
                        <label for="phone">手機號碼</label>
                        <input type="tel" id="phone" required pattern="09\d{8}" placeholder="例如：0912345678">
                    </div>

                    <div class="form-group">
                        <label for="customeremail">電子信箱</label>
                        <input type="email" id="customeremail" required placeholder="接收訂單明細用">
                    </div>

                    <div class="form-group">
                        <label for="shipping">配送超商</label>
                        <select id="shipping" required>
                            <option value="" disabled selected>請選擇取貨超商</option>
                            <option value="7-11">7-11</option>
                            <option value="FamilyMart">全家</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <div class="cart-right-panel">
            
            <div class="memo-card-main2">
                <h3 class="panel-title">購物車清單</h3>
                
                <div id="summary-items-container">
                    </div>

                <div class="checkout-action-area">
                    <button type="button" id="btn-submit-order" class="submit-order-btn">
                        <img src="images/ui/cart_success.png" alt="確認送出訂單">
                    </button>
                    
                    <div class="total-price-tag">
                        <span id="order-total-price">NT$ 0</span>
                    </div>
                </div>
            </div>

            <div class="memo-card-main3-dynamic">
                <div class="memo3-top-bg"></div>
                
                <div class="memo3-content-body">
                    <h3 class="panel-title-green">預購商品</h3>
                    
                    <div id="detail-items-container">
                        </div>
                </div>
                
                <div class="memo3-bottom-bg"></div>
            </div>

        </div>
        
    </div>

    <div class="transition-overlay"></div>

    <script src="js/api.js"></script>    
    <script src="js/cart.js"></script>
</body>
</html>
