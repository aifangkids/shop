<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/cart.css">
</head>
<body>

    <div class="cart-wrapper">
        <!-- 頂部品牌暖心抬頭 -->
        <header class="cart-header">
            <h1>Aifang kids</h1>
            <p class="subtitle">專屬編號：<span id="display-afid">載入中</span></p>
        </header>

        <!-- 主要內容區塊 -->
        <main class="cart-container">
            
            <!-- 左側/上方：暫存購物車商品清單 -->
            <section class="cart-items-section">
                <h2>🛒 預購商品</h2>
                <div id="cart-loading" class="loading-text">讀取購物車</div>
                
                <!-- 商品清單容器 -->
                <div id="cart-list"></div>

                <!-- 結帳總金額 -->
                <div class="cart-summary-box">
                    <div class="summary-row">
                        <span>商品小計：</span>
                        <span>NT$ <span id="text-subtotal">0</span></span>
                    </div>
                    <div class="summary-row grand-total">
                        <span>應付總金額：</span>
                        <span>NT$ <span id="text-grand-total">0</span></span>
                    </div>
                </div>
            </section>

            <!-- 右側/下方：正式訂單收件資料填寫表單 -->
            <section class="cart-form-section">
                <h2>📦 填寫收件與匯款資料</h2>
                <form id="order-form">
                    
                    <div class="form-group">
                        <label for="input-line">LINE 名稱 <span class="required">*</span></label>
                        <input type="text" id="input-line" placeholder="請輸入您的 LINE 名稱" required>
                    </div>

                    <div class="form-group">
                        <label for="input-name">收件人姓名 <span class="required">*</span></label>
                        <input type="text" id="input-name" placeholder="請務必填寫與【身分證件】相符之真實姓名" required>
                        <small class="form-note">⚠️ 超商取貨不付款需核對身分證件</small>
                    </div>

                    <div class="form-group">
                        <label for="input-phone">手機號碼 <span class="required">*</span></label>
                        <input type="tel" id="input-phone" placeholder="09XX-XXX-XXX" maxlength="12" required>
                    </div>

                    <div class="form-group">
                        <label for="input-email">電子信箱 <span class="required">*</span></label>
                        <input type="email" id="input-email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="select-shipping">配送超商 (取貨不付款) <span class="required">*</span></label>
                        <select id="select-shipping" required>
                            <option value="7-11">7-11</option>
                            <option value="全家">全家</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="input-store">超商門市店號與店名 <span class="required">*</span></label>
                        <input type="text" id="input-store" placeholder="例如：123456 頂好門市" required>
                    </div>

                    <!-- 匯款區塊與店鋪政策 -->
                    <div class="form-group">
                        <label>匯款帳號後 5 碼 <span class="optional">(給予對方的備註請勿填寫，以免不利核對帳號與金額)</span></label>
                        
                        <!-- 💰 匯款資訊卡 -->
                        <div class="bank-info-card">
                            <div class="bank-title-text">💰 匯款資訊</div>
                            <div class="bank-detail-text">
                                <strong>戶名：</strong>璦坊童裝<br>
                                <strong>銀行：</strong>103 臺灣新光商業銀行<br>
                                <strong>分行：</strong>0675 斗六分行<br>
                                <strong>帳號：</strong>0675101004736
                            </div>
                            <div class="bank-deadline-alert"> 請於 24 小時之內完成匯款，逾時視同放棄訂單</div>
                        </div>

                        <!-- 填寫後五碼輸入框 -->
                        <input type="text" id="ipt-lastFive" class="form-input" placeholder="例如：12345 (已匯款再填寫)" maxlength="5">
                        <small class="form-note">💡 若尚未匯款可先留白，後續請至【查詢訂單】完成匯款</small>
                    </div>

                    <!-- 小條款政策清單 -->
                    <ul class="shop-policy-list">
                        <li class="shop-policy-item">商品金額已含營業稅</li>
                        <li class="shop-policy-item">取貨時請務必攜帶與收件人姓名相同的證件</li>
                        <li class="shop-policy-item">依《消費者保護法》規範，享有七天鑑賞期退換貨服務</li>
                        <li class="shop-policy-item">退換貨商品須保持全新、未剪標且完整包裝</li>
                    </ul>

                    <!-- 提交按鈕 -->
                    <button type="submit" id="btn-submit-order" class="btn-submit">💗完成訂單</button>
                </form>
            </section>

        </main>
    </div>

    <script src="js/cart.js"></script>
    <script src="js/articles.js"></script>
</body>
</html>
