<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/lookup.css">
</head>
<body>

    <div id="falling-container"></div>

    <div class="lookup-wrapper">
        
        <header class="lookup-card search-box-card">
            <h1 class="lookup-main-title">訂單進度查詢</h1>
            <p class="lookup-sub-desc">請輸入您的【手機號碼】或【理貨單號 (例如: sh0001)】隨時追蹤最新動態與補填匯款資料</p>
            
            <form id="form-lookup" onsubmit="handleOrderLookup(event)">
                <div class="search-input-group">
                    <input type="text" id="ipt-keyword" class="lookup-input" placeholder="請輸入手機號碼或 sh 理貨單號" required>
                    <button type="submit" id="btn-search" class="btn-lookup-submit">開始查詢 🔍</button>
                </div>
            </form>
        </header>

        <div id="lookup-loading" class="lookup-status-msg hidden">
            <div class="lookup-spinner"></div>
            <p>正在努力連線後台，幫您翻找預購明細中</p>
        </div>

        <div id="lookup-empty" class="lookup-status-msg">
            <p>🌸 請在上方輸入資料並按下查詢鈕</p>
        </div>

        <div id="lookup-results-container" class="hidden">
            </div>

    </div>

    <script src="js/articles.js"></script>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwJ0ERb9MhwFqtkMSE9UpfcrtGB7tnnn7LoXYJwSCrCCzn40NubmxQZUCQWqgmMI64c/exec";

        // 頁面載入時，自動檢查網址有沒有帶過來的單號
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shippingId = urlParams.get("shippingId") || urlParams.get("uid");
            if (shippingId) {
                document.getElementById("ipt-keyword").value = shippingId;
                executeLookup(shippingId);
            }
        });

        // 表單提交觸發
        function handleOrderLookup(event) {
            event.preventDefault();
            const keyword = document.getElementById("ipt-keyword").value.trim();
            if (!keyword) return;
            executeLookup(keyword);
        }

        // 執行查詢主核心
        async function executeLookup(keyword) {
            const loader = document.getElementById("lookup-loading");
            const emptyBox = document.getElementById("lookup-empty");
            const resultsContainer = document.getElementById("lookup-results-container");
            const btnSearch = document.getElementById("btn-search");

            // 切換 UI 狀態
            loader.classList.remove("hidden");
            emptyBox.classList.add("hidden");
            resultsContainer.classList.add("hidden");
            resultsContainer.innerHTML = "";
            btnSearch.disabled = true;

            try {
                // 向 GAS 發送查詢請求 (對接您已部署好的新網址)
                const response = await fetch(`${GAS_API_URL}?action=lookupOrder&keyword=${encodeURIComponent(keyword)}`);
                if (!response.ok) throw new Error("網路連線異常");
                
                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    renderOrderCards(result.data);
                    resultsContainer.classList.remove("hidden");
                } else {
                    emptyBox.innerHTML = `❌ 找不到與「${keyword}」相關的訂單紀錄，請檢查號碼是否正確，或連繫 LINE 官方客服核對唷`;
                    emptyBox.classList.remove("hidden");
                }
            } catch (error) {
                console.error("查詢錯誤:", error);
                emptyBox.innerHTML = "<p style='color:var(--accent-red);'>🐾 後台塞車中或網路不穩，請稍等幾秒後再試一次</p>";
                emptyBox.classList.remove("hidden");
            } finally {
                loader.classList.add("hidden");
                btnSearch.disabled = false;
            }
        }

        // 動態渲染訂單卡片列表 (考量到一組手機號碼可能有多筆預購單)
        function renderOrderCards(orders) {
            const container = document.getElementById("lookup-results-container");
            container.innerHTML = "";

            orders.forEach(order => {
                const card = document.createElement("div");
                card.classList.add("lookup-card", "result-card");

                // 依據訂單狀態決定標籤顏色與樣式
                let statusClass = "status-unpaid";
                let statusText = order.status || "未付款";
                if (statusText === "已確認" || statusText === "已對帳") statusClass = "status-confirmed";
                if (statusText === "已出貨") statusClass = "status-shipped";

                // 計算衣服總件數與總額 (相容後台格式)
                let totalQty = order.totalQty || 0;
                let totalAmount = order.totalAmount || 0;
                
                // 建立衣服小明細區塊
                let itemsHtml = "";
                if (order.items && order.items.length > 0) {
                    itemsHtml = `<div class="lookup-items-summary"><strong>📦 預購明細：</strong><ul class="mini-item-list">`;
                    order.items.forEach(item => {
                        itemsHtml += `<li>${item.prodName} (${item.color || '無'}/${item.size || '無'}) x ${item.quantity}</li>`;
                    });
                    itemsHtml += `</ul></div>`;
                }

                // 建立補填匯款後五碼區塊
                let lastFiveHtml = "";
                if (statusText === "未付款") {
                    lastFiveHtml = `
                        <div class="update-bank-box" id="bank-box-${order.shippingId}">
                            <div class="update-bank-title">💰 補填匯款後五碼</div>
                            <div class="update-bank-row">
                                <input type="text" id="ipt-five-${order.shippingId}" class="lookup-input-mini" placeholder="後5碼" maxlength="5" value="${order.lastFive || ''}">
                                <button onclick="submitLastFive('${order.shippingId}')" id="btn-five-${order.shippingId}" class="btn-lookup-mini">送出更新</button>
                            </div>
                        </div>
                    `;
                } else {
                    lastFiveHtml = order.lastFive ? `<p class="order-meta-line"><strong>匯款後五碼：</strong>已填寫 (${order.lastFive})</p>` : "";
                }

                card.innerHTML = `
                    <div class="result-card-header">
                        <div class="result-ship-id">🚚 單號：<span>${order.shippingId || '核對中'}</span></div>
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                    
                    <div class="result-card-body">
                        <p class="order-meta-line"><strong>專屬訂單編號：</strong>${order.uid || '--'}</p>
                        <p class="order-meta-line"><strong>收件人真實姓名：</strong>${order.receiverName || ''}</p>
                        <p class="order-meta-line"><strong>LINE 名稱：</strong>${order.lineName || ''}</p>
                        <p class="order-meta-line"><strong>取貨方式：</strong>${order.logistics || ''}</p>
                        <p class="order-meta-line"><strong>指定門市：</strong>${order.storeInfo || ''}</p>
                        <p class="order-meta-line"><strong>預購商品總計：</strong><span class="highlight-text">${totalQty}</span> 件，金額 <span class="highlight-price">$${totalAmount}</span></p>
                        
                        ${itemsHtml}
                        ${lastFiveHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 補填匯款五碼的線上即時提交非同步處理
        async function submitLastFive(shippingId) {
            const inputField = document.getElementById(`ipt-five-${shippingId}`);
            const btn = document.getElementById(`btn-five-${shippingId}`);
            const code = inputField.value.trim();

            if (!code || code.length !== 5 || isNaN(code)) {
                alert("請輸入正確的銀行帳號後 5 碼數字");
                return;
            }

            btn.disabled = true;
            btn.innerText = "傳送中...";

            try {
                const payload = {
                    action: "updateLastFive",
                    shippingId: shippingId,
                    lastFive: code
                };

                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    mode: "cors",
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("上傳資料失敗");
                const res = await response.json();

                if (res.success) {
                    alert("🎉 匯款後五碼已成功補填更新！收到通知後會立刻幫您對帳，謝謝您");
                    const bankBox = document.getElementById(`bank-box-${shippingId}`);
                    bankBox.innerHTML = `<p class="update-bank-success">✅ 已成功補上後五碼：<strong>${code}</strong> (處理中)</p>`;
                } else {
                    alert("系統訊息：" + res.message);
                    btn.disabled = false;
                    btn.innerText = "送出更新";
                }
            } catch (error) {
                console.error("更新後五碼出錯:", error);
                alert("哎呀，連線有些塞車，請稍後再試一次！");
                btn.disabled = false;
                btn.innerText = "送出更新";
            }
        }
    </script>
</body>
</html>
