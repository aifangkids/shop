<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aifang kids</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/index.css">
</head>
<body>

    <div id="falling-container"></div>

    <div class="index-wrapper">
        <div class="welcome-box">
            
            <!-- 🌟 溫馨回流捕鼠夾提示框 (預設隱藏，由 JS 控制顯示) -->
            <div id="return-hint-banner" class="return-hint-banner hidden">
                🧸 偵測到您有尚未完成的追加品唷！<br>
                <span class="click-text">點擊此處立刻回商品選單繼續挑選/結帳 ➔</span>
            </div>

            <div class="brand-logo">Aifangkids</div>
            <p class="brand-intro">
                <span>Childhood should always feel this beautiful.</span>
            </p>

            <div class="action-divider"></div>

            <div id="step-init">
                <button id="btn-generate" class="btn-common btn-action">生成專屬訂單編號</button>
            </div>

            <div id="step-loading" class="status-layer hidden">
                <div class="spinner"></div>
                <p class="loading-text">🐾 正在為您連線，生成不重複編號</p>
            </div>

            <div id="step-success" class="status-layer hidden">
                <p class="success-alert">🎉 專屬訂單編號生成完畢</p>
                <div id="uid-display" class="uid-highlight">----</div>
                <p class="next-hint">請幫記住您的專屬訂單編號，並點擊下方進入選購：</p>
                <button id="btn-go-detail" class="btn-common btn-next">🧸 進入童裝預購區 ➔</button>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
    <script src="js/articles.js"></script>
</body>
</html>
